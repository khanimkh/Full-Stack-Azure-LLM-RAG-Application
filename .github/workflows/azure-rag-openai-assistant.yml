name: Azure RAG OpenAI Assistant

on:
  push:
    branches:
      - main
    paths:
      - azure-rag-openai-assistant/**
      - .github/workflows/azure-rag-openai-assistant.yml
  pull_request:
    paths:
      - azure-rag-openai-assistant/**
      - .github/workflows/azure-rag-openai-assistant.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  PROJECT_DIR: azure-rag-openai-assistant

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r $PROJECT_DIR/requirements.txt
      - run: python -m compileall $PROJECT_DIR/backend
      - run: pytest $PROJECT_DIR/tests

  security:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit bandit
      - run: pip-audit -r $PROJECT_DIR/requirements.txt
      - run: bandit -r $PROJECT_DIR/backend -x $PROJECT_DIR/tests
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT_DIR }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  build:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/azure-rag-openai-assistant:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/azure-rag-openai-assistant:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python $PROJECT_DIR/infra/scripts/export_env_config.py $PROJECT_DIR/infra/environments/staging.json >> $GITHUB_ENV
      - run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: bash $PROJECT_DIR/infra/scripts/deploy_containerapp.sh
        env:
          DEPLOYMENT_ENV: staging
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          IMAGE_NAME: ghcr.io/${{ env.REPO }}/azure-rag-openai-assistant
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          SEARCH_ENDPOINT: ${{ vars.SEARCH_ENDPOINT }}
          SEARCH_INDEX_NAME: ${{ vars.SEARCH_INDEX_NAME }}
      - run: bash $PROJECT_DIR/infra/scripts/configure_alerts.sh
        env:
          DEPLOYMENT_ENV: staging
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      - run: bash $PROJECT_DIR/infra/scripts/configure_traffic.sh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python $PROJECT_DIR/infra/scripts/export_env_config.py $PROJECT_DIR/infra/environments/production.json >> $GITHUB_ENV
      - run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - id: deploy
        run: bash $PROJECT_DIR/infra/scripts/deploy_containerapp.sh
        env:
          DEPLOYMENT_ENV: production
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          IMAGE_NAME: ghcr.io/${{ env.REPO }}/azure-rag-openai-assistant
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          SEARCH_ENDPOINT: ${{ vars.SEARCH_ENDPOINT }}
          SEARCH_INDEX_NAME: ${{ vars.SEARCH_INDEX_NAME }}
      - run: bash $PROJECT_DIR/infra/scripts/configure_alerts.sh
        env:
          DEPLOYMENT_ENV: production
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      - run: bash $PROJECT_DIR/infra/scripts/configure_traffic.sh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          NEW_REVISION: ${{ steps.deploy.outputs.new_revision }}
