name: Deploy to Azure Container Apps (ACR)

on:
  push:
    branches: [ main ]

env:
  ACR_NAME: containerregisterysearch
  RESOURCE_GROUP: llm-test
  CONTAINER_APP_NAME: container-app-test
  IMAGE_NAME: myregistry-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # 2. Login to Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 3. Login to ACR
    - name: Login to ACR
      run: |
        az acr login --name $ACR_NAME

    # 4. Build Docker image
    - name: Build Image
      run: |
        docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .
        docker tag $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

    # 5. Push image to ACR
    - name: Push Image
      run: |
        docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
        docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

    # 6. Deploy to Azure Container Apps
    - name: Deploy to Container App
      run: |
        az containerapp update \
          --name $CONTAINER_APP_NAME \
          --resource-group $RESOURCE_GROUP \
          --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}